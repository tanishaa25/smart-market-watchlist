server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routing (e.g. /stock/RELIANCE) — nginx
    # must fall back to index.html for any path that isn't a real static
    # file, letting the frontend router take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxies API calls to the backend container (see docker-compose.yml
    # — "backend" resolves via Docker's internal DNS). Mirrors the same
    # role Vite's dev-server proxy plays locally.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Needed for the SSE stream endpoint — buffering would delay
        # real-time price ticks until nginx's buffer filled up.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
